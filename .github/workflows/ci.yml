name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'   # weekly: the integration changes without this repo changing
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify dist is up to date
        run: |
          git diff --exit-code dist/roomba-plus-card.js || {
            echo "dist/roomba-plus-card.js is out of date — run npm run build and commit the result"
            exit 1
          }

  # Adapted from ha_roomba_plus's identically-named check (session: CI
  # pipeline review). Motivated there by a real drift (README badge stuck
  # two releases behind manifest.json) — same class of mistake is just as
  # possible here, and package.json + README are already out of sync in
  # exactly the tolerated way (badge "2.3" vs package.json "2.3.0"), so
  # this is verified against a real repo state, not a hypothetical.
  version-badge:
    name: Version Badge Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check README badge vs. package.json
        run: python3 scripts/check_version_badge.py

  # v3.0 A7 — contract guard v2. Clones the integration (public, no
  # credentials) at `main` and at its newest `dev-*` beta branch, and checks
  # that every translation_key, action and action field the card uses still
  # exists (scripts/contract_check.py), and that every state slug the card
  # compares against is still declared (tests/slugs.test.ts on a fixture
  # refreshed from each branch). Runs weekly as well: the integration moves
  # without the card's repo changing.
  contract:
    name: Integration contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Clone integration (main + newest beta branch)
        run: |
          REPO=https://github.com/johnnyh1975/ha_roomba_plus.git
          BETA=$(git ls-remote --heads "$REPO" 'dev-*' | sed 's#.*refs/heads/##' | sort -V | tail -n 1)
          git clone --depth 1 --branch main "$REPO" int-main
          if [ -n "$BETA" ]; then git clone --depth 1 --branch "$BETA" "$REPO" int-beta; fi
          echo "beta branch: ${BETA:-none}"

      - name: Keys, actions and fields the card uses
        run: |
          DIRS="int-main"; [ -d int-beta ] && DIRS="$DIRS int-beta"
          python3 scripts/contract_check.py $DIRS

      - name: State slugs (main)
        run: |
          python3 scripts/update_contract.py int-main
          npx vitest run tests/slugs.test.ts

      - name: State slugs (beta)
        if: hashFiles('int-beta/custom_components/roomba_plus/manifest.json') != ''
        run: |
          python3 scripts/update_contract.py int-beta
          npx vitest run tests/slugs.test.ts
